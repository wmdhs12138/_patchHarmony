name: Build GKI

on:
  push:
    paths:
      - 'src/**'
      - 'compat/**'
      - 'Makefile'
      - 'vivo_loader_probe.c'
      - 'mk/**'
      - 'deps.lst'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        kmi:
          - android13-5.15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Validate ABI helper scripts
        run: python3 -m py_compile scripts/vivo_abi_preflight.py scripts/vivo_probe_inputs.py

      - name: Fetch deps
        env:
          HOO_FORK_URL: https://github.com/wmdhs12138/HooKern.git
        run: |
          scripts/fetch-deps.sh
          echo "HooKern commit:"
          git -C deps/HooKern rev-parse HEAD
          grep -F 'ptep = h->guard[i].ptep;' deps/HooKern/lib/hk_inline.c

      - name: Build ${{ matrix.kmi }}
        run: |
          make VER=${{ matrix.kmi }} > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      - name: Zero warning gate
        run: |
          if grep -nE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      # Compile success and ABI compatibility are separate things.
      # This report is informational: a passing CI job never certifies safe loading.
      - name: V2338A read-only ABI preflight
        run: |
          python3 scripts/vivo_abi_preflight.py \
            out/${{ matrix.kmi }}/droid_lkm.ko \
            --json out/${{ matrix.kmi }}/vivo_abi_report.json \
            | tee out/${{ matrix.kmi }}/vivo_abi_report.txt
          {
            echo '### V2338A ABI preflight (not a load certification)'
            echo '```text'
            cat out/${{ matrix.kmi }}/vivo_abi_report.txt
            echo '```'
            echo 'Even if the build is green, DO NOT insmod without ABI and hook safety validation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Minimal loader probe metadata
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.vivo_abi_preflight import inspect

          path = Path("out") / os.environ["KMI"] / "vivo_loader_probe.ko"
          meta, versions, imports = inspect(path)
          if meta["module_name"] != "vivo_loader_probe":
              raise SystemExit("Unexpected probe module identity")
          report = {
              "path": str(path),
              "module": meta,
              "imports": sorted(imports),
              "embedded_crcs": versions,
              "verdict": "BUILD_ONLY_NOT_VERIFIED_FOR_V2338A",
              "storage_writes": "none in probe source",
              "note": "Loader still validates vermagic, CRC and GKI protection before module init"
          }
          print(json.dumps(report, indent=2))
          (path.parent / "vivo_loader_probe_report.json").write_text(
              json.dumps(report, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.kmi }}-BUILD_ONLY
          path: |
            out/${{ matrix.kmi }}/droid_lkm.ko
            out/${{ matrix.kmi }}/droid_lkm_compat.ko
            out/${{ matrix.kmi }}/vivo_loader_probe.ko
            out/${{ matrix.kmi }}/vivo_loader_probe_report.json
            out/${{ matrix.kmi }}/vivo_abi_report.json
            out/${{ matrix.kmi }}/vivo_abi_report.txt
          if-no-files-found: warn
